name: Mapa sin conexión

# Se corre a mano (Actions → Mapa sin conexión → Run workflow) o el día 1 de cada mes.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el AMBA
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: python3 tools/offline_map.py mapa-amba.sqlite

      - name: Tamaño
        run: ls -lh mapa-amba.sqlite

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mapa-amba
          name: Mapa del AMBA para cargar por USB
          body: |
            Copiá mapa-amba.sqlite y calles-amba.sqlite a la raíz del pendrive, conectalo al estéreo y en el launcher andá a Ajustes → Mapa sin conexión → Desde USB.
            Trae CABA y Zonas Norte (hasta Pilar y Escobar), Oeste (hasta General Rodríguez) y Sur (hasta La Plata), en tema claro y oscuro.
          files: mapa-amba.sqlite
          make_latest: "false"
